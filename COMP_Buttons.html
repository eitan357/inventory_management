<!-- COMP_Buttons.html -->
<script>
  // -------- SVG paths --------

  const _COPY_ICON_PATHS    = `<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>`;
  const _CHECK_ICON_PATHS   = `<polyline points="20 6 9 17 4 12" stroke-linecap="round" stroke-linejoin="round"/>`;
  const _SHARE_ICON_PATHS   = `<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>`;
  const _SHEETS_ICON_PATHS  = `<rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/>`;
  const _BACK_ICON_PATHS    = `<polyline points="9 18 15 12 9 6"/>`;
  const _TRASH_ICON_PATHS   = `<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>`;
  const _REFRESH_ICON_PATHS = `<polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>`;

  function _actionBtnSvg(paths) {
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${paths}</svg>`;
  }

  // -------- UI factory functions --------

  function UI_createCopyButton(label, onclickExpr, extraClass = "") {
    return `<button class="copy-btn ${extraClass}" onclick="${onclickExpr}" data-tooltip="העתקה">${_actionBtnSvg(_COPY_ICON_PATHS)}</button>`;
  }

  function UI_createShareButton(onclickExpr, extraClass = "") {
    return `<button class="copy-btn ${extraClass}" onclick="${onclickExpr}" data-tooltip="שיתוף">${_actionBtnSvg(_SHARE_ICON_PATHS)}</button>`;
  }

  function UI_createSheetsButton(onclickExpr, extraClass = "") {
    return `<button class="copy-btn ${extraClass}" onclick="${onclickExpr}" data-tooltip="יצירת Sheet">${_actionBtnSvg(_SHEETS_ICON_PATHS)}</button>`;
  }

  function UI_createBackButton(backPage) {
    return `<button type="button" class="action-btn" onclick="_navBack(this,'${backPage}')" data-tooltip="חזרה">${_actionBtnSvg(_BACK_ICON_PATHS)}</button>`;
  }

  function UI_createClearButton(resetFn) {
    return `<button type="button" class="action-btn clear-btn" onclick="_navClearAnim(this); ${resetFn}" data-tooltip="ניקוי טופס">${_actionBtnSvg(_TRASH_ICON_PATHS)}</button>`;
  }

  function UI_createRefreshButton(id = "refresh-btn") {
    return `<button id="${id}" type="button" class="action-btn action-btn-light" onclick="refreshAppData()" data-tooltip="רענן נתונים">${_actionBtnSvg(_REFRESH_ICON_PATHS)}</button>`;
  }

  // -------- Action handlers --------

  function _navBack(btn, backPage) {
    btn.classList.add('going');
    clearTimeout(btn._backTimer);
    btn._backTimer = setTimeout(() => {
      btn.classList.remove('going');
      showPage(backPage);
    }, 250);
  }

  function _navClearAnim(btn) {
    btn.classList.remove('clearing');
    void btn.offsetWidth;
    btn.classList.add('clearing');
    setTimeout(() => btn.classList.remove('clearing'), 500);
  }

  function UI_doCopy(btn, text, originalLabel) {
    navigator.clipboard.writeText(text).catch((err) => console.error("שגיאה בהעתקה:", err));
    const svg = btn.querySelector("svg");
    const savedBg = btn.style.background;
    btn.style.background = "";
    btn.classList.add("copied");
    if (svg) svg.innerHTML = _CHECK_ICON_PATHS;
    clearTimeout(btn._copyTimer);
    btn._copyTimer = setTimeout(() => {
      btn.classList.remove("copied");
      if (svg) svg.innerHTML = _COPY_ICON_PATHS;
      btn.style.background = savedBg;
    }, 1800);
  }

  // -------- Long-press tooltip --------
  (function () {
    let _lpTimer = null;
    let _lpEl = null;

    function _showLpTooltip(target, text) {
      if (!_lpEl) {
        _lpEl = document.createElement("div");
        _lpEl.id = "_lp-tooltip";
        _lpEl.style.cssText =
          "position:fixed;background:rgba(0,0,0,0.72);color:#fff;padding:5px 11px;" +
          "border-radius:7px;font-size:12px;pointer-events:none;z-index:99999;" +
          "white-space:nowrap;opacity:0;transition:opacity 0.15s;";
        document.body.appendChild(_lpEl);
      }
      _lpEl.textContent = text;
      _lpEl.style.display = "block";
      const rect = target.getBoundingClientRect();
      const tipTop = rect.top - 36;
      _lpEl.style.top  = (tipTop < 8 ? rect.bottom + 8 : tipTop) + "px";
      _lpEl.style.left = (rect.left + rect.width / 2) + "px";
      _lpEl.style.transform = "translateX(-50%)";
      requestAnimationFrame(() => { _lpEl.style.opacity = "1"; });
    }

    function _hideLpTooltip() {
      if (_lpEl) { _lpEl.style.opacity = "0"; _lpEl.style.display = "none"; }
      clearTimeout(_lpTimer);
      _lpTimer = null;
    }

    function _startTimer(e) {
      const btn = e.target.closest("[data-tooltip]");
      if (!btn) return;
      _lpTimer = setTimeout(() => _showLpTooltip(btn, btn.dataset.tooltip), 500);
    }

    document.addEventListener("mousedown",   _startTimer);
    document.addEventListener("touchstart",  _startTimer, { passive: true });
    ["mouseup","mouseleave","touchend","touchcancel"].forEach((ev) =>
      document.addEventListener(ev, _hideLpTooltip)
    );
  })();

  // -------- שיתוף וייצוא --------

  function UI_shareContent(text, title) {
    if (navigator.share) {
      navigator.share({ title: title || "", text }).catch((e) => {
        if (e.name !== "AbortError") _showShareFallback(text, title);
      });
    } else {
      _showShareFallback(text, title);
    }
  }

  function _showShareFallback(text, title) {
    const existing = document.getElementById("_ui-share-popup");
    if (existing) { existing.remove(); return; }

    const encoded = encodeURIComponent(text);
    const encodedTitle = encodeURIComponent(title || "");

    const popup = document.createElement("div");
    popup.id = "_ui-share-popup";
    popup.style.cssText = "position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:white;border:1px solid #dee2e6;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,0.18);padding:16px 20px;z-index:9999;display:flex;flex-direction:column;gap:10px;min-width:200px;text-align:center;";
    popup.innerHTML = `
      <div class="fw-bold small mb-1">שתף דרך</div>
      <a href="https://wa.me/?text=${encoded}" target="_blank" class="btn btn-success btn-sm">WhatsApp</a>
      <a href="mailto:?subject=${encodedTitle}&body=${encoded}" class="btn btn-outline-secondary btn-sm">מייל</a>
      <button class="btn btn-outline-secondary btn-sm" onclick="document.getElementById('_ui-share-popup').remove()">ביטול</button>
    `;
    document.body.appendChild(popup);

    setTimeout(() => {
      const handler = (e) => {
        if (!popup.contains(e.target)) {
          popup.remove();
          document.removeEventListener("click", handler);
        }
      };
      document.addEventListener("click", handler);
    }, 100);
  }

  async function UI_exportToSheets({ title, columns, rows }) {
    const headers = columns.map((c) => c.label);
    const data = rows.map((row) =>
      columns.map((col) =>
        col.searchVal ? String(col.searchVal(row) ?? "") : String(row[col.key] ?? "")
      )
    );

    showLoading("יוצר גיליון...");
    try {
      const url = await _callServerAsync(r => r.createSheetsExport({ title, headers, data }));
      hideLoading();
      window.open(url, "_blank");
    } catch (e) {
      hideLoading();
      alert("שגיאה ביצירת הגיליון: " + e.message);
    }
  }
</script>
