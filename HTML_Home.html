<div id="home-page" class="page active">
  <div class="welcome-section mb-5 mt-3 text-center">
    <h2 class="fw-bold">
      שלום, <span class="user-greeting text-primary"></span> 👋
    </h2>
    <p class="text-muted">מה תרצה לבצע היום?</p>
  </div>

  <!-- כל הכרטיסים חייבים להיות בתוך ה-row הזה בשביל ריווח תקין -->
  <div class="row g-4">
    <!-- כרטיס ניפוק -->
    <div class="col-12">
      <div
        class="modern-action-card primary-variant"
        onclick="showPage('outbound-page')"
      >
        <div class="card-icon-container">
          <span class="main-emoji">📤</span>
        </div>
        <div class="card-text-content">
          <h4 class="fw-bold mb-1">ניפוק ציוד</h4>
          <p class="mb-0 text-muted small">יצירת חתימה חדשה</p>
        </div>
        <div class="card-arrow-container">
          <span class="arrow-svg">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              fill="currentColor"
              viewBox="0 0 16 16"
            >
              <path
                fill-rule="evenodd"
                d="M11.354 8.354a.5.5 0 0 0 0-.708L7.5 3.854a.5.5 0 1 0-.708.708L10.293 8l-3.5 3.5a.5.5 0 0 0 .708.708l3.854-3.854z"
              />
            </svg>
          </span>
        </div>
      </div>
    </div>

    <!-- כרטיס שינוי סטטוס -->
    <div class="col-12">
      <div
        class="modern-action-card primary-variant"
        onclick="showStatusPage()"
      >
        <div class="card-icon-container">
          <span class="main-emoji">🔄</span>
        </div>
        <div class="card-text-content">
          <h4 class="fw-bold mb-1">שינוי סטטוס</h4>
          <p class="mb-0 text-muted small">זיכוי, החלפת חתימה או אספנה</p>
        </div>
        <div class="card-arrow-container">
          <span class="arrow-svg">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              fill="currentColor"
              viewBox="0 0 16 16"
            >
              <path
                fill-rule="evenodd"
                d="M11.354 8.354a.5.5 0 0 0 0-.708L7.5 3.854a.5.5 0 1 0-.708.708L10.293 8l-3.5 3.5a.5.5 0 0 0 .708.708l3.854-3.854z"
              />
            </svg>
          </span>
        </div>
      </div>
    </div>

    <!-- כרטיס אימות וצפייה בדוח צ (הועבר לתוך ה-row) -->
    <div class="col-12">
      <div
        class="modern-action-card primary-variant"
        onclick="showPage('validator-page')"
      >
        <div class="card-icon-container" style="background: #f3e5f5">
          <span class="main-emoji">📋</span>
        </div>
        <div class="card-text-content">
          <h4 class="fw-bold mb-1">דוח צ' ואימות</h4>
          <p class="mb-0 text-muted small">
            צפייה במצבת ה-צ' או אימות מול הצוותים
          </p>
        </div>
        <div class="card-arrow-container">
          <span class="arrow-svg">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              fill="currentColor"
              viewBox="0 0 16 16"
            >
              <path
                fill-rule="evenodd"
                d="M11.354 8.354a.5.5 0 0 0 0-.708L7.5 3.854a.5.5 0 1 0-.708.708L10.293 8l-3.5 3.5a.5.5 0 0 0 .708.708l3.854-3.854z"
              />
            </svg>
          </span>
        </div>
      </div>
    </div>

    <!-- כרטיס דוח מלאי -->
    <div class="col-12">
      <div
        class="modern-action-card primary-variant"
        onclick="showPage('inventory-page')"
      >
        <div class="card-icon-container" style="background: #e8f5e9">
          <span class="main-emoji">📦</span>
        </div>
        <div class="card-text-content">
          <h4 class="fw-bold mb-1">דוח מלאי</h4>
          <p class="mb-0 text-muted small">
            סינון לפי צוות, מיקום, מכשיר או חותם
          </p>
        </div>
        <div class="card-arrow-container">
          <span class="arrow-svg">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              fill="currentColor"
              viewBox="0 0 16 16"
            >
              <path
                fill-rule="evenodd"
                d="M11.354 8.354a.5.5 0 0 0 0-.708L7.5 3.854a.5.5 0 1 0-.708.708L10.293 8l-3.5 3.5a.5.5 0 0 0 .708.708l3.854-3.854z"
              />
            </svg>
          </span>
        </div>
      </div>
    </div>
  </div>
  <!-- סגירת row -->
</div>
